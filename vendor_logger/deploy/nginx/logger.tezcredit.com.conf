# /etc/nginx/sites-available/logger.tezcredit.com.conf
# Reverse proxy: https://logger.tezcredit.com  ->  vendor-logger container on 127.0.0.1:9013
#
# Install on the vendor-logger EC2 host (13.207.231.147):
#   sudo apt-get update && sudo apt-get install -y nginx
#   sudo cp logger.tezcredit.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/logger.tezcredit.com.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# TLS cert (Let's Encrypt) — needs port 80 reachable + the DNS A record live first:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot certonly --nginx -d logger.tezcredit.com
#   (certbot auto-renews via the systemd timer)
#
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# PREREQUISITES (outside nginx):
#   1. DNS:  logger.tezcredit.com  A  13.207.231.147   (the EIP)
#   2. Security group: allow 80 + 443 from the internet (or your client CIDRs).
#      The app port 9013 must stay private — only nginx (localhost) talks to it.

# ── HTTP :80 — ACME challenge + redirect everything else to HTTPS ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name logger.tezcredit.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — TLS termination, proxy to the local vendor-logger ────────────
server {
    # Combined ssl+http2 on the listen line — compatible with nginx 1.18
    # (Ubuntu 22.04). The newer `http2 on;` directive needs nginx >= 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logger.tezcredit.com;

    # Managed by certbot (paths exist after `certbot certonly`)
    ssl_certificate     /etc/letsencrypt/live/logger.tezcredit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logger.tezcredit.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Vendor event payloads carry request/response bodies — allow a bit of room.
    client_max_body_size 5m;

    # Don't leak nginx version
    server_tokens off;

    access_log /var/log/nginx/logger.tezcredit.com.access.log;
    error_log  /var/log/nginx/logger.tezcredit.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:9013;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The logger returns 202 fast (fire-and-forget); keep timeouts modest.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
