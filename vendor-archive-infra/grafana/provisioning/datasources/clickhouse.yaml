apiVersion: 1

datasources:
  - name: Vendor Archive ClickHouse
    uid: vendor-archive-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: ${CLICKHOUSE_HOST}
      port: ${CLICKHOUSE_PORT}
      protocol: http
      username: ${CLICKHOUSE_USER}
      defaultDatabase: ${CLICKHOUSE_DATABASE}
      tlsSkipVerify: false
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
